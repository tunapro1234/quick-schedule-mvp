version: '3'

services:
  app:
    build: .
    # Only expose to internal network
    expose:
      - "3000"
    restart: always
    networks:
      - app_network

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - app
    restart: always
    networks:
      - app_network

networks:
  app_network: 