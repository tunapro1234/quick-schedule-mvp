version: '3'

services:
  app:
    build: .
    # Use a fixed internal port that we'll reference in the host's Nginx config
    ports:
      - "3001:3000"
    restart: always

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - app
    restart: always
    networks:
      - app_network

networks:
  app_network: 